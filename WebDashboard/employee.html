<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NSF - Employee Management</title>
  <meta name="description" content="NSF National Steel Fabrication - Employee Management">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-container" id="appMain">

    <!-- HEADER -->
    <header class="app-header">
      <div class="header-branding">
        <a href="dashboard.html" class="back-btn" title="Back to Dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <img src="nsf.png" alt="NSF" class="header-logo-img">
        <div class="header-titles">
          <h1>Employee Management</h1>
          <span class="subtitle">Search, Add, Update & Delete Employees</span>
        </div>
      </div>

      <div class="user-profile-badge">
        <div class="user-avatar" id="userAvatar">MW</div>
        <div class="user-info">
          <span class="user-name" id="loggedInUserName">User</span>
          <span class="user-role">Authenticated</span>
        </div>
        <button type="button" class="btn-logout" id="btnLogout" title="Sign Out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>

      <div class="header-actions">
        <button type="button" class="btn-icon" id="themeToggleBtn" title="Toggle Theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- EMPLOYEE CONTENT -->
    <main class="main-content">

      <!-- SEARCH SECTION -->
      <section class="card form-section">
        <div class="section-title-sm">Search Employee</div>
        <div class="emp-search-bar">
          <div class="form-group emp-search-input-group">
            <label for="searchNationalID" class="form-label">Enter National ID</label>
            <input type="number" id="searchNationalID" class="form-control" placeholder="e.g. 29901011234567">
          </div>
          <div class="emp-search-actions">
            <button type="button" class="btn btn-primary" id="btnSearch">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              Search
            </button>
            <button type="button" class="btn btn-secondary" id="btnRefresh">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              </svg>
              Refresh
            </button>
          </div>
        </div>
      </section>

      <!-- EMPLOYEE FORM -->
      <section class="card form-section">
        <div class="section-header-bar">
          <div class="section-title-sm">Employee Details</div>
          <div class="lock-indicator" id="empModeIndicator">
            <span id="empEIDDisplay">New Employee</span>
          </div>
        </div>
        
        <!-- Hidden EID -->
        <input type="hidden" id="empEID" value="">

        <div class="grid grid-2">
          <div class="form-group">
            <label for="empFirstName" class="form-label">First Name <span class="required">*</span></label>
            <input type="text" id="empFirstName" class="form-control" placeholder="Enter first name">
          </div>
          <div class="form-group">
            <label for="empSecondName" class="form-label">Second Name <span class="required">*</span></label>
            <input type="text" id="empSecondName" class="form-control" placeholder="Enter second name">
          </div>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label for="empNationalID" class="form-label">National ID <span class="required">*</span></label>
            <input type="number" id="empNationalID" class="form-control" placeholder="Enter national ID">
          </div>
          <div class="form-group">
            <label for="empPhoneNumber" class="form-label">Phone Number</label>
            <input type="text" id="empPhoneNumber" class="form-control" placeholder="Enter phone number">
          </div>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label for="empAddress" class="form-label">Address</label>
            <input type="text" id="empAddress" class="form-control" placeholder="Enter address">
          </div>
          <div class="form-group">
            <label for="empTitle" class="form-label">Title</label>
            <input type="text" id="empTitle" class="form-control" placeholder="Enter job title">
          </div>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label for="empSerial" class="form-label">Serial (Auto-Generated)</label>
            <input type="text" id="empSerial" class="form-control readonly-input" placeholder="Auto-generated" readonly>
          </div>
          <div class="form-group">
            <label for="empMail" class="form-label">Mail</label>
            <input type="email" id="empMail" class="form-control" placeholder="Enter email address">
          </div>
        </div>

        <div class="grid grid-2">
          <div class="form-group">
            <label for="empBirthDate" class="form-label">Birth Date</label>
            <input type="date" id="empBirthDate" class="form-control">
          </div>
          <div class="form-group">
            <span class="form-label">&nbsp;</span>
            <span class="emp-serial-preview" id="empSerialDisplay"></span>
          </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="emp-form-actions">
          <button type="button" class="btn btn-primary btn-lg" id="btnAddEmp">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="19" y1="8" x2="19" y2="14"></line>
              <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
            Add New Employee
          </button>
          <button type="button" class="btn btn-accent btn-lg" id="btnUpdateEmp" style="opacity:0.4">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
            Update
          </button>
          <button type="button" class="btn btn-danger btn-lg" id="btnDeleteEmp" style="opacity:0.4">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Delete
          </button>
        </div>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="app-footer">
      <p>&copy; 2026 NSF — National Steel Fabrication. Employee Portal.</p>
      <div class="footer-links"><a href="#"><span class="status-dot online"></span> API Connected</a></div>
    </footer>
  </div>

  <!-- CUSTOM DELETE CONFIRM MODAL -->
  <div class="confirm-overlay hidden" id="deleteConfirmOverlay">
    <div class="confirm-modal" id="deleteConfirmModal">
      <div class="confirm-icon-wrap">
        <div class="confirm-icon confirm-icon-danger">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </div>
      </div>
      <div class="confirm-content">
        <h3 class="confirm-title">تأكيد الحذف / Confirm Delete</h3>
        <p class="confirm-subtitle" id="confirmDeleteMsg">هل أنت متأكد من حذف هذا الموظف؟</p>
        <div class="confirm-emp-badge" id="confirmEmpBadge"></div>
      </div>
      <div class="confirm-actions">
        <button type="button" class="btn btn-secondary" id="confirmCancelBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          إلغاء / Cancel
        </button>
        <button type="button" class="btn btn-danger-solid" id="confirmDeleteBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          نعم، احذف / Yes, Delete
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="employee.js"></script>
</body>
</html>
